<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{business_name}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="{{google_fonts_href}}" rel="stylesheet">
  <style>
    /* ── Smooth scroll (motion-gated) ───────────────────── */
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    /* ── Color tokens ─────────────────────────────────── */
    :root {
      --bg:           oklch(0.985 0.005 60);
      --surface:      oklch(0.965 0.007 65);
      --border:       oklch(0.905 0.010 65);
      --ink:          oklch(0.22 0.015 50);
      --ink-muted:    oklch(0.45 0.013 50);
      --ink-quiet:    oklch(0.62 0.011 55);
      --accent:       oklch(0.62 0.16 35);
      --accent-quiet: oklch(0.92 0.04 35);
      --nav-h:        56px;
      /* Font family variables — overridden by visual system per lead */
      --font-display: 'Fraunces', serif;
      --font-body:    'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    /* ── Per-lead visual system overrides (palette + fonts) ── */
    {{visual_system_overrides}}

    /* ── Reset & base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1.0625rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    p { max-width: 62ch; }

    a { color: inherit; }
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ── Transitions ──────────────────────────────────── */
    @media (prefers-reduced-motion: no-preference) {
      a, button { transition: color 120ms ease-out, background-color 120ms ease-out; }
    }

    /* Scroll anchors clear the sticky nav */
    section[id], div[id] {
      scroll-margin-top: calc(var(--nav-h) + 8px);
    }

    /* ── Section reveal (JS-gated) ───────────────────── */
    html.js-reveal-enabled section.reveal:not(.hero-reveal) {
      opacity: 0;
      transform: translateY(20px);
    }

    @media (prefers-reduced-motion: no-preference) {
      html.js-reveal-enabled section.reveal.in-view:not(.hero-reveal) {
        transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Sticky site nav ─────────────────────────────── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0 1.5rem;
      height: var(--nav-h);
    }

    @supports (backdrop-filter: blur(8px)) {
      .site-nav {
        background: oklch(0.985 0.005 60 / 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
    }

    .site-nav-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.0625rem;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .site-nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      flex: 1;
      padding: 0;
    }

    .site-nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      white-space: nowrap;
      padding-bottom: 2px;
      border-bottom: 1.5px solid transparent;
    }

    .site-nav-links a:hover { color: var(--ink); }

    .site-nav-links a[aria-current="true"] {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .site-nav-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem;
      color: var(--ink);
      flex-shrink: 0;
      margin-left: auto;
    }

    .site-nav-hamburger svg { display: block; }

    @media (max-width: 640px) {
      .site-nav-links { display: none; }
      .site-nav-hamburger { display: flex; align-items: center; }
      .site-nav-cta { display: none; }
    }

    .site-nav-cta {
      margin-left: auto;
      flex-shrink: 0;
      display: inline-block;
      padding: 0.5625rem 1.25rem;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 4px;
      white-space: nowrap;
    }

    .site-nav-cta:hover { background: oklch(0.30 0.015 50); }
    .site-nav-cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* ── Mobile menu overlay ─────────────────────────── */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
    }

    .mobile-menu.is-open { display: flex; }

    .mobile-menu-close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink);
      padding: 0.25rem;
    }

    .mobile-menu-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 0;
    }

    .mobile-menu-links a {
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .mobile-menu-links a:hover { color: var(--accent); }

    .mobile-menu-cta {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.125rem;
      text-decoration: none;
      border-radius: 4px;
    }

    /* ── Hero section ───────────────────────────────── */
    .brand-hero { /* first section — no margin-top */ }

    .hero-bg {
      position: relative;
      min-height: 90vh;
      background-color: var(--surface);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
    }

    @media (max-width: 640px) {
      .hero-bg { min-height: 75vh; }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        oklch(0.10 0.015 50 / 0.08) 0%,
        oklch(0.10 0.015 50 / 0.55) 100%
      );
      pointer-events: none;
    }

    .hero-bg.hero-no-image .hero-overlay { display: none; }

    .hero-bg:not(.hero-no-image)::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 -160px 100px -80px oklch(0.10 0.015 50 / 0.45);
      pointer-events: none;
    }

    .hero-layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: min(1100px, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: 4rem 5rem;
    }

    .hero-content { max-width: 60%; }

    @media (max-width: 768px) {
      .hero-content { max-width: 100%; }
    }

    .hero-bg:not(.hero-no-image) .hero-eyebrow,
    .hero-bg:not(.hero-no-image) .hero-name,
    .hero-bg:not(.hero-no-image) .hero-tagline {
      color: rgba(255, 255, 255, 0.93);
    }

    .hero-bg.hero-no-image .hero-eyebrow  { color: var(--accent); }
    .hero-bg.hero-no-image .hero-name     { color: var(--ink); }
    .hero-bg.hero-no-image .hero-tagline  { color: var(--ink-muted); }

    .hero-bg:not(.hero-no-image) .hero-secondary-cta { color: rgba(255,255,255,0.7); }
    .hero-bg:not(.hero-no-image) .hero-secondary-cta:hover { color: rgba(255,255,255,0.95); }
    .hero-bg.hero-no-image .hero-secondary-cta { color: var(--ink-muted); }
    .hero-bg.hero-no-image .hero-secondary-cta:hover { color: var(--ink); }

    .hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .hero-rule {
      width: 56px;
      border: none;
      border-top: 1.5px solid var(--ink-quiet);
      margin-bottom: 1.125rem;
    }

    .hero-bg:not(.hero-no-image) .hero-rule {
      border-top-color: rgba(255,255,255,0.45);
    }

    .hero-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(3.5rem, 9vw + 1rem, 9rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      max-width: 14ch;
    }

    .hero-tagline {
      margin-top: 1.25rem;
      font-size: 1.125rem;
      line-height: 1.5;
      max-width: 50ch;
    }

    .hero-actions {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .hero-cta {
      display: inline-block;
      padding: 0.9375rem 1.875rem;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.125rem;
      text-decoration: none;
      border-radius: 4px;
      white-space: nowrap;
    }

    .hero-cta:hover { background: oklch(0.30 0.015 50); }
    .hero-cta:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }

    .hero-secondary-cta {
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
      white-space: nowrap;
    }

    .hero-attribution {
      position: absolute;
      bottom: 0.75rem;
      right: 1rem;
      z-index: 2;
      font-size: 0.6875rem;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
    }

    .hero-attribution:hover { color: rgba(255,255,255,0.85); }

    /* ── Stats strip — 3-col ─────────────────────────── */
    .stats-strip {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem;
    }

    .stats-inner {
      max-width: min(960px, calc(100% - 3rem));
      margin-inline: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 2rem;
    }

    .stats-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      text-align: center;
    }

    .stats-numeral {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.5rem, 5vw + 1rem, 4rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .stats-numeral--text {
      font-size: clamp(1.125rem, 2vw + 0.5rem, 1.5rem);
      letter-spacing: -0.01em;
    }

    .stats-caption {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    /* ── Why Us section ──────────────────────────────── */
    .why-us-section {
      background: var(--accent-quiet);
      padding-block: 6rem;
    }

    .why-us-inner {
      max-width: min(960px, calc(100% - 3rem));
      margin-inline: auto;
    }

    .why-us-caption {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
    }

    .why-us-items {
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    .why-us-item {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      max-width: 680px;
    }

    .why-us-item--offset { margin-left: 2rem; }

    @media (max-width: 640px) {
      .why-us-item--offset { margin-left: 0; }
    }

    .why-us-num {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 0.9;
      color: var(--ink-quiet);
      flex-shrink: 0;
      letter-spacing: -0.02em;
      min-width: 3rem;
    }

    .why-us-text {
      font-size: 1.125rem;
      line-height: 1.55;
      color: var(--ink);
      max-width: 50ch;
    }

    /* ── Shared section inner container ──────────────── */
    .section-inner,
    .services-inner {
      max-width: min(960px, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: 5rem;
    }

    /* Intentionally varied rhythm — not uniform 5rem everywhere */
    .services-inner        { padding-block: 6rem; }
    .testimonials-section .section-inner { padding-block: 7rem; }
    .what-changes-section .section-inner { padding-block: 4.5rem; }
    .contact-section .section-inner      { padding-block: 4.5rem; }

    .section-caption {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    /* Services section caption hangs into the gutter on wide viewports —
       one intentional alignment break to signal designed, not templated  */
    @media (min-width: 1060px) {
      .services-inner .section-caption {
        margin-left: -2rem;
      }
    }

    .section-heading {
      margin-top: 0.5rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    /* ── Services section ─────────────────────────────── */
    .services-section { background: var(--surface); }

    /* Featured service (01) — numbered like supporting rows, no boxed chip */
    .service-featured-wrap { margin-top: 2rem; }

    .service-featured {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      padding: 2.25rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .service-featured-num {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 0.9;
      color: var(--ink-quiet);
      flex-shrink: 0;
      letter-spacing: -0.02em;
      min-width: 2.5rem;
    }

    .service-featured-body { flex: 1; }

    .service-featured-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.375rem, 2vw + 0.5rem, 1.75rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 0.875rem;
    }

    .service-supporting-list { margin-top: 0; }

    .service-row {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      padding-block: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .service-row-num {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 0.9;
      color: var(--ink-quiet);
      flex-shrink: 0;
      letter-spacing: -0.02em;
      min-width: 2.5rem;
    }

    .service-row-body { flex: 1; }

    .service-row-title {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1.0625rem;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .service-details { margin-top: 0.5rem; }

    .service-summary {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--ink-muted);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      user-select: none;
    }

    .service-summary::-webkit-details-marker { display: none; }

    .service-summary::after {
      content: '›';
      font-size: 1rem;
      transition: transform 150ms ease-out;
    }

    details[open] .service-summary::after { transform: rotate(90deg); }

    .service-details-body {
      margin-top: 0.625rem;
      font-size: 0.9375rem;
      color: var(--ink-muted);
      line-height: 1.55;
      max-width: 56ch;
    }

    /* ── What Changes section ─────────────────────────── */
    .what-changes-section { border-top: 1px solid var(--border); }

    .change-rows {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
    }

    .change-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1.5rem;
      align-items: center;
      padding-block: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .change-row:first-child { border-top: none; }

    @media (max-width: 640px) {
      .change-row { grid-template-columns: 1fr; gap: 0.75rem; }
      .change-arrow { display: none; }
    }

    .change-gap-label, .change-fix-label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .change-gap-label { color: var(--ink-quiet); }
    .change-fix-label { color: var(--accent); }

    .change-gap-text {
      font-size: 0.9375rem;
      color: var(--ink-muted);
      max-width: 38ch;
    }

    .change-fix-text {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--ink);
      max-width: 38ch;
    }

    .change-arrow { font-size: 1.125rem; color: var(--ink-quiet); flex-shrink: 0; }

    /* ── Testimonials section ─────────────────────────── */
    .testimonials-section { border-top: 1px solid var(--border); }

    .testimonials-list {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    .testimonial-item { display: flex; flex-direction: column; gap: 0.875rem; }

    .testimonial-stars {
      color: var(--ink-quiet);
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    .testimonial-quote {
      position: relative;
      font-family: var(--font-display);
      font-weight: 600;
      font-style: italic;
      font-size: clamp(1.5rem, 2vw + 1rem, 2.25rem);
      line-height: 1.3;
      color: var(--ink);
    }

    .testimonial-curly-quote {
      position: absolute;
      top: -0.75rem;
      left: -0.25rem;
      font-size: 3.5rem;
      color: var(--accent);
      font-family: var(--font-display);
      font-weight: 600;
      font-style: normal;
      line-height: 1;
      pointer-events: none;
      opacity: 0.7;
    }

    .testimonial-quote-text { display: inline; padding-left: 2rem; }

    .testimonial-attribution {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .testimonial-google-link {
      margin-top: 0.375rem;
      display: inline-block;
      font-size: 0.8125rem;
      color: var(--ink-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .testimonial-google-link:hover { color: var(--ink); }

    /* ── Contact section ──────────────────────────────── */
    .contact-section {
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .contact-layout {
      margin-top: 0;
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 2.5rem;
      align-items: start;
      padding-top: 1.5rem;
    }

    @media (max-width: 640px) {
      .contact-layout { grid-template-columns: 1fr; }
    }

    .contact-dl {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 1.5rem;
      row-gap: 1rem;
      align-items: baseline;
    }

    .contact-dl dt {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .contact-dl dd { font-size: 1.0625rem; color: var(--ink); }

    .contact-map {
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .contact-map iframe {
      display: block;
      width: 100%;
      height: 400px;
      border: 0;
    }

    @media (max-width: 640px) {
      .contact-map iframe { height: 260px; }
    }

    /* ── Footer ───────────────────────────────────────── */
    .page-footer {
      border-top: 1px solid var(--border);
      padding: 3rem 1.5rem 2.5rem;
      background: var(--surface);
    }

    .footer-inner {
      max-width: min(960px, calc(100% - 3rem));
      margin-inline: auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    @media (max-width: 640px) {
      .footer-inner { grid-template-columns: 1fr; gap: 2rem; }
    }

    .footer-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      color: var(--ink);
    }

    .footer-tagline {
      margin-top: 0.25rem;
      font-size: 0.8125rem;
      color: var(--ink-quiet);
      max-width: 28ch;
    }

    .footer-col-label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
      margin-bottom: 0.75rem;
    }

    .footer-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .footer-list a,
    .footer-list li {
      font-size: 0.875rem;
      color: var(--ink-muted);
      text-decoration: none;
    }

    .footer-list a { text-decoration: underline; text-underline-offset: 3px; }
    .footer-list a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <header class="site-nav" id="site-nav">
    <span class="site-nav-name">{{business_name}}</span>
    <nav aria-label="Site sections">
      <ul class="site-nav-links">
        {{why_nav_link}}
        <li><a href="#services">Services</a></li>
        <li><a href="#reviews">Reviews</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <button class="site-nav-hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu" id="hamburger-btn">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="2" y1="6" x2="20" y2="6"/>
        <line x1="2" y1="11" x2="20" y2="11"/>
        <line x1="2" y1="16" x2="20" y2="16"/>
      </svg>
    </button>
    <a href="{{cta_href}}" class="site-nav-cta">{{cta_label}}</a>
  </header>
  <div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <button class="mobile-menu-close" aria-label="Close menu" id="mobile-menu-close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <ul class="mobile-menu-links">
      {{why_nav_link}}
      <li><a href="#services">Services</a></li>
      <li><a href="#reviews">Reviews</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <a href="{{cta_href}}" class="mobile-menu-cta">{{cta_label}}</a>
  </div>
  <main>
    {{brand_hero}}
    {{stats}}
    {{why_us}}
    {{services}}
    {{what_changes}}
    {{testimonials}}
    {{contact}}
    {{site_footer}}
  </main>
  <script>
  (function() {
    'use strict';

    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* -- Section reveal ---------------------------------------- */
    if (!prefersReduced && 'IntersectionObserver' in window) {
      document.documentElement.classList.add('js-reveal-enabled');
      var sections = document.querySelectorAll('section');
      var revealSections = Array.prototype.slice.call(sections, 1);
      revealSections.forEach(function(s) { s.classList.add('reveal'); });

      var revealObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) {
            e.target.classList.add('in-view');
            revealObserver.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });

      revealSections.forEach(function(s) { revealObserver.observe(s); });
    }

    /* -- Scrollspy --------------------------------------------- */
    if ('IntersectionObserver' in window) {
      var navLinks = document.querySelectorAll('.site-nav-links a[href^="#"]');

      var spyObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) {
            var id = e.target.getAttribute('id');
            navLinks.forEach(function(a) {
              var matches = a.getAttribute('href') === '#' + id;
              a.setAttribute('aria-current', matches ? 'true' : 'false');
            });
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });

      ['why', 'services', 'reviews', 'contact'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) spyObserver.observe(el);
      });
    }

    /* -- Mobile menu ------------------------------------------- */
    var hamburger = document.getElementById('hamburger-btn');
    var mobileMenu = document.getElementById('mobile-menu');
    var closeBtn = document.getElementById('mobile-menu-close');

    function openMenu() {
      if (!mobileMenu || !hamburger) return;
      mobileMenu.classList.add('is-open');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
      if (closeBtn) closeBtn.focus();
    }

    function closeMenu() {
      if (!mobileMenu || !hamburger) return;
      mobileMenu.classList.remove('is-open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      hamburger.focus();
    }

    if (hamburger) hamburger.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);

    if (mobileMenu) {
      mobileMenu.addEventListener('click', function(e) {
        if (e.target === mobileMenu) closeMenu();
      });
      mobileMenu.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', closeMenu);
      });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && mobileMenu && mobileMenu.classList.contains('is-open')) {
        closeMenu();
      }
    });
  })();
  </script>
</body>
</html>
