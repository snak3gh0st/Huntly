<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{page_title}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: 250 250 250;
      --fg: 17 17 17;
      --muted: 115 115 115;
      --border: 229 229 229;
      --primary: 16 185 129;
      --primary-fg: 255 255 255;
      --card: 255 255 255;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: 17 17 17;
        --fg: 245 245 245;
        --muted: 163 163 163;
        --border: 38 38 38;
        --card: 23 23 23;
      }
    }
    body { background: rgb(var(--bg)); color: rgb(var(--fg)); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { background: rgb(var(--card)); border: 1px solid rgb(var(--border)); }
    .muted { color: rgb(var(--muted)); }
    .btn-primary { background: rgb(var(--primary)); color: rgb(var(--primary-fg)); }
  </style>
</head>
<body class="antialiased">
  <main class="mx-auto max-w-3xl px-6 py-12 sm:py-16 space-y-12">
    {{sections}}
  </main>
</body>
</html>
