<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{page_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Color tokens ─────────────────────────────────── */
    :root {
      --bg:           oklch(0.985 0.005 60);
      --surface:      oklch(0.965 0.007 65);
      --border:       oklch(0.905 0.010 65);
      --ink:          oklch(0.22 0.015 50);
      --ink-muted:    oklch(0.45 0.013 50);
      --ink-quiet:    oklch(0.62 0.011 55);
      --accent:       oklch(0.62 0.16 35);
      --accent-quiet: oklch(0.92 0.04 35);
    }

    /* ── Reset & base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Container ────────────────────────────────────── */
    .container {
      max-width: min(640px, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: 3rem;
    }

    /* ── Typography ───────────────────────────────────── */
    .display {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 5vw + 1rem, 4.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    h2, .h2 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    h3, .h3 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.125rem;
      line-height: 1.3;
    }

    .caption {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .body-large { font-size: 1.25rem; line-height: 1.5; }

    p { max-width: 62ch; }

    a { color: inherit; }
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ── Transitions ──────────────────────────────────── */
    @media (prefers-reduced-motion: no-preference) {
      a, button { transition: color 120ms ease-out, background-color 120ms ease-out; }
    }
  </style>
</head>
<body>
  <main class="container">
    {{sections}}
  </main>
</body>
</html>
