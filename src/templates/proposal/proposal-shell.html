<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Proposal for {{business_name}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Color tokens ─────────────────────────────────── */
    :root {
      --bg:           oklch(0.985 0.005 60);
      --surface:      oklch(0.965 0.007 65);
      --border:       oklch(0.905 0.010 65);
      --ink:          oklch(0.22 0.015 50);
      --ink-muted:    oklch(0.45 0.013 50);
      --ink-quiet:    oklch(0.62 0.011 55);
      --accent:       oklch(0.62 0.16 35);
      --accent-quiet: oklch(0.92 0.04 35);
    }

    /* ── Reset & base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Container ────────────────────────────────────── */
    .page-container {
      max-width: min(640px, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: 3rem;
    }

    /* ── Typography helpers ───────────────────────────── */
    .display {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 5vw + 1rem, 4.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .caption {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .body-large { font-size: 1.25rem; line-height: 1.5; }

    p { max-width: 62ch; }

    a { color: inherit; }
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ── Transitions ──────────────────────────────────── */
    @media (prefers-reduced-motion: no-preference) {
      a, button { transition: color 120ms ease-out, background-color 120ms ease-out; }
    }

    /* ── Vertical rhythm — per-section margin-top ─────── */
    .proposal-intro                    { /* first — no margin-top */ }
    .diagnosis-section                 { margin-top: 4rem; }
    .brand-hero                        { margin-top: 5rem; }
    .services-section                  { margin-top: 4rem; }
    .testimonials-section              { margin-top: 5rem; }
    .contact-section                   { margin-top: 4rem; }
    .pricing-section                   { margin-top: 6rem; }
    .cta-form-section                  { margin-top: 2.5rem; }
    .page-footer                       { margin-top: 6rem; }

    /* ── Proposal intro ───────────────────────────────── */
    .proposal-intro {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
    }

    .proposal-intro .intro-eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .proposal-intro .intro-salutation {
      margin-top: 0.75rem;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .proposal-intro .intro-pitch {
      margin-top: 1rem;
      color: var(--ink-muted);
      max-width: 62ch;
    }

    /* ── Diagnosis section ────────────────────────────── */
    .diagnosis-section .section-caption {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .diagnosis-section .section-heading {
      margin-top: 0.5rem;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .diagnosis-list {
      margin-top: 1.5rem;
      list-style: none;
    }

    .diagnosis-item {
      display: flex;
      gap: 0.875rem;
      align-items: flex-start;
      padding-block: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .diagnosis-item:first-child { border-top: none; padding-top: 0; }

    .diagnosis-icon {
      flex-shrink: 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      margin-top: 0.15rem;
    }

    .diagnosis-icon svg { width: 18px; height: 18px; }

    .diagnosis-label {
      font-weight: 600;
      font-size: 1.0625rem;
      line-height: 1.3;
    }

    .diagnosis-evidence {
      margin-top: 0.25rem;
      font-size: 0.9375rem;
      color: var(--ink-muted);
    }

    /* ── Brand hero ───────────────────────────────────── */
    .brand-hero .hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
      margin-bottom: 1rem;
    }

    .brand-hero .hero-name {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 5vw + 1rem, 4.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .brand-hero .hero-tagline {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      line-height: 1.5;
      color: var(--ink-muted);
      max-width: 62ch;
    }

    .brand-hero .hero-description {
      margin-top: 0.75rem;
      color: var(--ink);
      max-width: 62ch;
    }

    /* ── Services section ─────────────────────────────── */
    .services-section .section-caption {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .services-section .section-heading {
      margin-top: 0.5rem;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .services-grid {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: 1fr;
      column-gap: 2rem;
      row-gap: 2.5rem;
    }

    @media (min-width: 640px) {
      .services-grid { grid-template-columns: 1fr 1fr; }
    }

    .service-item .service-title {
      font-weight: 600;
      font-size: 1.125rem;
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .service-item .service-title svg { width: 16px; height: 16px; flex-shrink: 0; }

    .service-item .service-desc {
      margin-top: 0.375rem;
      font-size: 0.9375rem;
      color: var(--ink-muted);
      max-width: 62ch;
    }

    /* ── Testimonials section ─────────────────────────── */
    .testimonials-section .section-caption {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .testimonials-section .section-heading {
      margin-top: 0.5rem;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .testimonials-list {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .testimonial-item .testimonial-quote {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-style: italic;
      font-size: 1.25rem;
      line-height: 1.45;
      color: var(--ink);
    }

    .testimonial-item .testimonial-attribution {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    /* ── Contact section ──────────────────────────────── */
    .contact-section .section-caption {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .contact-section .section-heading {
      margin-top: 0.5rem;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .contact-dl {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 2rem;
      row-gap: 1rem;
      align-items: baseline;
    }

    .contact-dl dt {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .contact-dl dd {
      font-size: 1.0625rem;
      color: var(--ink);
    }

    /* ── Pricing section ──────────────────────────────── */
    .pricing-section .pricing-tier {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .pricing-section .pricing-headline {
      margin-top: 0.5rem;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .pricing-price-wrap {
      margin-top: 1.5rem;
      display: flex;
      align-items: flex-start;
      line-height: 1;
    }

    .pricing-currency {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.75rem;
      color: var(--ink);
      padding-top: 0.35rem;
    }

    .pricing-numeral {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(3rem, 6vw + 1rem, 5.5rem);
      line-height: 1.0;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .pricing-subline {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      color: var(--ink-muted);
    }

    .pricing-bullets {
      margin-top: 1.5rem;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .pricing-bullet {
      display: flex;
      align-items: baseline;
      gap: 0.625rem;
      font-size: 0.9375rem;
      font-weight: 500;
    }

    .pricing-bullet-glyph {
      font-size: 0.375rem;
      color: var(--ink-quiet);
      flex-shrink: 0;
      position: relative;
      top: -0.1em;
    }

    /* ── CTA form section ─────────────────────────────── */
    .cta-form-section .cta-heading {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 1.5vw + 1rem, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .cta-form-section .cta-reassurance {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: var(--ink-muted);
    }

    .cta-form {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .form-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--ink);
      border-width: 2px;
    }

    .form-checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      font-size: 0.875rem;
      color: var(--ink-muted);
    }

    .form-checkbox-row input[type="checkbox"] {
      margin-top: 0.2rem;
      flex-shrink: 0;
      accent-color: var(--ink);
    }

    .form-actions {
      padding-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: var(--ink);
      color: var(--bg);
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.125rem;
      line-height: 1.3;
      text-align: center;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-primary:hover {
      background: oklch(0.30 0.015 50);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .payment-link {
      display: block;
      text-align: center;
      font-size: 0.875rem;
      color: var(--ink-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .payment-link:hover { color: var(--ink); }

    /* ── Footer ───────────────────────────────────────── */
    .page-footer {
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .page-footer p {
      font-size: 0.875rem;
      color: var(--ink-quiet);
    }

    .page-footer a {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .page-footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main class="page-container">
    {{proposal_intro}}
    {{diagnosis}}
    {{brand_hero}}
    {{services}}
    {{testimonials}}
    {{contact}}
    {{pricing}}
    {{cta_form}}
    {{site_footer}}
  </main>
</body>
</html>
