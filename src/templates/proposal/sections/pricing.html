<section class="pricing-section">
  <p class="pricing-tier">{{tier_label}}</p>
  <h2 class="pricing-headline">{{headline}}</h2>
  <div class="pricing-price-wrap">
    <span class="pricing-currency">$</span>
    <span class="pricing-numeral">{{price_numeral}}</span>
  </div>
  <p class="pricing-subline">One-time payment, includes 12 months hosting &amp; maintenance.</p>
  <ul class="pricing-bullets">{{value_bullets}}</ul>
</section>
