<section class="cta-banner-section reveal" id="cta-banner" aria-label="Call to action">
  <div class="cta-banner-inner">
    <div class="cta-banner-text">
      <h2 class="cta-banner-heading">{{headline}}</h2>
      <p class="cta-banner-sub">{{subheadline}}</p>
    </div>
    <a href="{{cta_href}}" class="cta-banner-btn">{{cta_label}}</a>
  </div>
</section>
